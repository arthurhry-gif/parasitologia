    <script>
      (function() {
        // Previne erro de estrutura circular (Converting circular structure to JSON)
        // causado quando scripts de rastreamento externos registram elementos DOM com React Fiber no console
        try {
          var originalStringify = JSON.stringify;
          JSON.stringify = function(value, replacer, space) {
            var seen = new WeakSet();
            var safeReplacer = function(key, val) {
              if (typeof val === "object" && val !== null) {
                if (typeof Node !== "undefined" && val instanceof Node) {
                  return "[DOMElement " + (val.nodeName || "Node") + "]";
                }
                if (typeof Window !== "undefined" && val instanceof Window) {
                  return "[Window]";
                }
                if (seen.has(val)) {
                  return "[Circular]";
                }
                seen.add(val);
              }
              if (typeof replacer === "function") {
                return replacer.call(this, key, val);
              }
              return val;
            };
            try {
              return originalStringify(value, safeReplacer, space);
            } catch (err) {
              try {
                return originalStringify(String(value));
              } catch (e) {
                return '"[Unserializable]"';
              }
            }
          };

          if (typeof console !== "undefined") {
            ['log', 'debug', 'info', 'warn', 'error'].forEach(function(method) {
              if (typeof console[method] === "function") {
                var originalMethod = console[method];
                console[method] = function() {
                  var safeArgs = [];
                  for (var i = 0; i < arguments.length; i++) {
                    var arg = arguments[i];
                    if (typeof Node !== "undefined" && arg instanceof Node) {
                      safeArgs.push("[" + arg.nodeName + (arg.id ? "#" + arg.id : "") + "]");
                    } else {
                      safeArgs.push(arg);
                    }
                  }
                  try {
                    return originalMethod.apply(console, safeArgs);
                  } catch (e) {
                    // Previne qualquer exceção em loggers de ambiente/iframe
                  }
                };
              }
            });
          }
        } catch (e) {
          // Fallback silencioso
        }
      })();
    </script>
